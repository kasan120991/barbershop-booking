packages:
  - packages/*
  - server
  - app
  - booking

# pnpm 11 blocks dependency install scripts by default (supply-chain hardening).
# Only add an entry when a dependency genuinely cannot work without one, and say why.
allowBuilds:
  # Downloads the platform-native binary it compiles with. Required by tsup and vitest.
  esbuild: true
  # Downloads the query and schema engine binaries. Without them the Prisma CLI
  # cannot generate a client or run a migration.
  '@prisma/engines': true
  prisma: true
